name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Unzip project
        run: |
          unzip -q surface-lod-step3-first-render-fixed.zip
          echo "Files after unzip:"
          find . -maxdepth 3 -type f | sort

      - name: Check project
        run: |
          test -f surface-lod/build.gradle
          echo "Found surface-lod/build.gradle!"

      - name: Build
        working-directory: surface-lod
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: surface-lod
          path: surface-lod/build/libs/*.jar
