name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Check project files
        run: |
          echo "Checking Surface LOD project..."
          test -f build.gradle
          test -f gradle.properties
          test -f settings.gradle
          test -f src/main/resources/fabric.mod.json
          test -f src/main/java/com/surfacelod/SurfaceLodClient.java
          test -f src/main/java/com/surfacelod/render/SurfaceLodRenderer.java
          test -f src/main/java/com/surfacelod/sample/SurfaceLodStore.java
          echo "All required files found!"

      - name: Build
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: surface-lod
          path: build/libs/*.jar
